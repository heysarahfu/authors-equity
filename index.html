<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authors Equity - The Author-Centered Book Publisher</title>
<link rel="icon" type="image/png" href="/assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header>
  <a class="logo" href="/"><img src="/assets/images/logo-black.webp" alt="Authors Equity" width="150" height="113"></a>
  <nav>
    <a href="/approach">Approach</a>
    <a href="/principles">Principles</a>
    <a href="/leadership">Leadership</a>
    <a href="/contact">Contact</a>
    <a href="https://authorsequity.substack.com/" target="_blank" rel="noopener">Substack</a>
  </nav>
</header>

<main style="max-width:none;padding-top:0;">
  <div class="hero">
    <img src="/assets/images/wordmark.webp" alt="Authors Equity" width="1500" height="799">
  </div>
  <div class="signup">
    <p>Want to hear more about what we&rsquo;ve been up to?</p>
    <form id="signup-form">
      <input type="email" name="email" placeholder="Email Address" required>
      <button type="submit">Sign Up for our Substack</button>
    </form>
  </div>
</main>

<footer>
  <div>Authors Equity | NY, NY | 2026 | <a href="/terms-conditions">Terms</a> | <a href="/privacy-policy">Privacy</a> | <a href="/catalog">Catalog</a></div>
  <div class="credit">Website and brand design by <a href="https://www.miloscovic.com/" target="_blank" rel="noopener">Milos Covic</a></div>
</footer>

<script>
// Substack has no public CORS-friendly subscribe API to POST to directly, so
// rather than fake an inline success state, hand off to Substack's own
// subscribe page with the address pre-filled — one confirm click for the
// reader instead of retyping their email.
document.getElementById('signup-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = new FormData(e.target).get('email');
  window.open(`https://authorsequity.substack.com/subscribe?email=${encodeURIComponent(email)}`, '_blank', 'noopener');
});
</script>
</body>
</html>
