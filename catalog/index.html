<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authors Equity — Catalog</title>
<style>
/* Restyled to match authorsequity.com's brand (see /assets/site.css there):
   brand yellow + Tiempos Fine serif headings + black, no red accent. Unlike
   the marketing pages, this is a single long, dense listing (100+ titles),
   so the yellow is used as a strong hero/chrome color rather than painting
   the entire scroll — the actual listings stay on a light, readable surface. */
@font-face{font-family:'Tiempos Fine';src:url('/assets/fonts/tiempos-fine-light.woff2') format('woff2');font-weight:300;font-display:swap;}
:root{--ink:#1A1918;--ink-2:#5C5A58;--ink-3:#9C9A98;--yellow:#FFCF00;--paper:#FAFAF8;--paper-2:#F0EFEC;--rule:#E2E0DC;--r:4px;--font:'Tiempos Fine',Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif;--toolbar-h:74px;--nav-h:56px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;}

.toolbar{position:sticky;top:0;z-index:100;background:var(--yellow);border-bottom:1.5px solid var(--ink);padding:14px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.toolbar .word{display:flex;align-items:center;}
.toolbar .word img{display:block;height:44px;width:auto;}
.toolbar-heading{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.toolbar .catalog-title{font-family:var(--font);font-weight:400;font-size:22px;white-space:nowrap;line-height:1.1;}
.toolbar .catalog-title .sep{margin:0 6px;}
.toolbar .catalog-title #season-range{font-family:var(--sans);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);}
.toolbar .gen{font-size:12px;color:var(--ink-2);}
.toolbar input[type=text]{font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--ink);border-radius:var(--r);min-width:180px;background:#fff;}
.btn{font:inherit;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:10px 18px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--yellow);cursor:pointer;}
.btn:hover{background:#1a1a1a;}
.btn-outline{background:#fff;color:var(--ink);border:1px solid var(--ink);}

.season-nav{position:sticky;top:var(--toolbar-h);z-index:99;background:var(--ink);border-bottom:1.5px solid var(--ink);padding:10px 32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.season-nav .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;margin-right:4px;}
.season-nav a{font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:20px;background:#fff;border:1px solid #fff;color:var(--ink);text-decoration:none;white-space:nowrap;}
.season-nav a:hover,.season-nav a.active{background:var(--yellow);border-color:var(--yellow);}

main{max-width:1080px;margin:0 auto;padding:0 32px 100px;}

.section{margin-bottom:8px;}
.section-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--rule);padding-bottom:8px;margin:48px 0 20px;scroll-margin-top:175px;}
/* Imprint sections (831 Stories, LYX) get their own brand mark next to the
   label, linking out to that imprint's own site — a little visual nod that
   these aren't just Authors Equity categories. */
.section-title.imprint-title{display:flex;align-items:center;gap:10px;}
.imprint-logo-link{display:inline-flex;align-items:center;line-height:0;}
.imprint-logo-link img{width:auto;display:block;}
.imprint-logo-link.i831 img{height:120px;}
.imprint-logo-link.ilyx img{height:84px;}
.section-title:first-of-type{margin-top:20px;}
.section-sub{font-size:12.5px;color:var(--ink-3);margin:-14px 0 20px;}
.subgroup-title{font-size:14px;font-weight:700;color:var(--ink);margin:26px 0 12px;display:flex;align-items:baseline;gap:8px;}
.subgroup-title .sg-note{font-size:11.5px;font-weight:400;color:var(--ink-3);}

/* ── One-per-page frontlist spread (current + next season only) ──
   The cover FLOATS left rather than sitting in a flex row with the title —
   that way the byline/title/subtitle and the photo+info-table row that
   follows all start right where the previous one ends, regardless of the
   cover's own height, instead of being held down to a shared row height.
   Text/rows simply wrap around the cover until they clear its bottom (a
   tall cover), then run full width — matches the print catalog's own
   layout (authorsequity.com/catalog) rather than a generic sell-sheet. */
.full-title{padding:28px 0;border-bottom:1px solid var(--rule);break-inside:avoid;overflow:hidden;}
.full-title .cover{float:left;width:150px;margin:0 28px 14px 0;}
.full-title .cover img,.full-title .cover .no-cover{width:100%;display:block;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.15);background:var(--paper-2);}
/* No forced aspect-ratio here (unlike the grid/carousel cards) — this is a
   single book on its own row, not a row of cards that need to line up, so
   there's nothing to gain from a fixed box and it just adds letterboxing
   for any cover that isn't exactly 2:3. Natural size looks cleaner. */
.full-title .cover img{height:auto;}
.full-title .cover .no-cover{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--ink-3);padding:10px;}
.full-title .byline{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);}
.full-title h2{font-family:var(--font);font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:6px;}
.full-title .subtitle{font-size:15px;color:var(--ink-2);font-style:italic;margin-top:4px;}

.ft-meta{display:flex;gap:20px;margin-top:16px;}
.ft-meta .ft-photo{width:150px;flex-shrink:0;}
.ft-meta .ft-photo img,.ft-meta .ft-photo .no-cover{width:100%;height:100%;display:block;border-radius:3px;background:var(--paper-2);object-fit:cover;}
.ft-meta .ft-photo .no-cover{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--ink-3);padding:8px;}
/* Fixed width regardless of how much space is left next to the photo (or
   the cover, once the float clears) — a 2-row table (just On Sale +
   one edition) stretching to fill all remaining width looked stretched
   and empty; a real width keeps it sized to its content instead. */
.info-table{border:1.5px solid var(--ink);border-radius:4px;padding:2px 18px;font-size:12.5px;width:300px;max-width:100%;flex:none;}
.info-table .it-row{display:flex;gap:14px;padding:7px 0;}
.info-table .it-row+.it-row{border-top:1px solid var(--rule);}
.info-table .it-label{width:80px;flex-shrink:0;color:var(--ink-3);}
.info-table .it-value{color:var(--ink);font-weight:600;}

.full-title .desc{font-size:13px;color:var(--ink);margin-top:20px;white-space:pre-line;}
.full-title .about-label{font-size:13px;font-weight:700;color:var(--ink);margin-top:18px;}
.full-title .bio{font-size:13px;color:var(--ink-2);margin-top:3px;white-space:pre-line;}

/* ── Generic compact grid card (used by 831 + fallback) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;margin-bottom:20px;}
.grid.grid-compact{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;}
.grid-item{break-inside:avoid;}
.grid-item img,.grid-item .no-cover{width:100%;aspect-ratio:2/3;border-radius:3px;background:var(--paper-2);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.grid-item img{object-fit:contain;}
.grid-item .no-cover{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:var(--ink-3);padding:8px;}
.grid-item .gi-title{font-size:12px;font-weight:600;margin-top:6px;}
.grid.grid-compact .gi-title{font-size:10.5px;}
.grid-item .gi-author{font-size:11px;color:var(--ink-2);}
.grid.grid-compact .gi-author{font-size:9.5px;}
.grid-item .gi-meta{font-size:10.5px;color:var(--ink-3);margin-top:2px;}
.grid.grid-compact .gi-meta{font-size:9px;}

/* ── Horizontal carousel (LYX series, backlist-by-theme) ── */
.carousel-wrap{position:relative;margin-bottom:8px;}
/* LYX series are short (2-4 books) — at full page width they never overflow,
   so the carousel never has anything to scroll to. Windowing it narrower
   than the page forces a real "browse through the series" interaction
   instead of a static row with two dead arrow buttons. */
.carousel-wrap.narrow{max-width:400px;}
.carousel-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin;}
.carousel-item{flex:0 0 128px;scroll-snap-align:start;}
.carousel-item img,.carousel-item .no-cover{width:100%;aspect-ratio:2/3;border-radius:3px;background:var(--paper-2);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.carousel-item img{object-fit:contain;}
.carousel-item .no-cover{display:flex;align-items:center;justify-content:center;text-align:center;font-size:9.5px;color:var(--ink-3);padding:6px;}
.carousel-item .ci-title{font-size:11.5px;font-weight:600;margin-top:6px;}
.carousel-item .ci-meta{font-size:10px;color:var(--ink-3);margin-top:1px;}
/* Linked LYX cards (out to lyxbooks.com) render as <a>, unlinked ones as
   <div> — reset the anchor so it looks identical to the unlinked case. */
a.carousel-item{display:block;color:inherit;text-decoration:none;}
a.carousel-item:hover .ci-title{text-decoration:underline;}

/* A compact info-table (price/ISBN/etc., dateless since it's standing in for
   several books at once) sits to the left of a LYX series' carousel or the
   831 Stories featured grid, echoing the frontlist spread's cover+info-table
   pairing at a smaller scale. Wraps to stack on narrow/mobile widths since
   the table can't shrink below its own content. */
.info-row{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;}
.info-row .info-table{flex:none;}
.info-row .carousel-wrap{margin-bottom:0;}
.info-row .grid{flex:1;min-width:220px;}
.series-desc{font-size:12.5px;color:var(--ink-2);max-width:700px;margin:-6px 0 14px;}
.carousel-btn{position:absolute;top:40%;transform:translateY(-50%);background:#fff;border:1px solid var(--rule);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--ink);z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.carousel-btn:disabled{opacity:.3;cursor:default;}
.carousel-btn.prev{left:-14px;}
.carousel-btn.next{right:-14px;}

/* ── 831 featured (newest season) vs rest ── */
.grid.grid-featured{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px;margin-bottom:28px;}
.grid-featured .gi-title{font-size:14px;}
.grid-featured .gi-author{font-size:12px;}
.grid-featured .gi-badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow);background:var(--ink);border-radius:10px;padding:2px 8px;margin-top:4px;}

.loading,.error{text-align:center;color:var(--ink-3);padding:80px 0;}

/* A thin scroll-position/date scrubber down the right edge — mobile only
   (see media query below). Hidden by default so it never affects desktop,
   where the season-nav's own horizontal pill bar is the only way to browse. */
.date-scrubber{display:none;}
.footer{max-width:1080px;margin:0 auto;padding:30px 32px 60px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3);text-align:center;}
.footer a{color:inherit;text-decoration:underline;}

@media(max-width:640px){
  .toolbar{padding:12px 16px;}
  .toolbar .catalog-title{white-space:normal;font-size:17px;}
  .toolbar input[type=text]{flex-basis:100%;min-width:0;}
  main{padding:28px 16px 80px;}
  .toolbar .gen{display:none;}

  /* The 831 Stories "featured" cards (new for the current season) need a
     200px-minimum column on desktop, which only ever fits one across on a
     phone — force 2 columns instead of leaving them stacked single-file. */
  .grid.grid-featured{grid-template-columns:repeat(2,1fr);gap:14px;}

  .season-nav{padding:8px 16px;}

  /* Cover + author photo run 2-up above the title/subtitle/info-table block,
     instead of the desktop treatment (cover floated left with text wrapping
     beside it, photo paired with the info table further down) — at phone
     width there's no room for text to wrap beside a cover, so that pattern
     just left a narrow, cramped column of text next to a tall image.
     ft-meta is unwrapped (display:contents) so its children — the photo and
     the info table — become direct flex items of .full-title and can be
     reordered independently: the photo joins the cover up top, the table
     drops to its own full-width row below the subtitle. */
  .full-title{display:flex;flex-wrap:wrap;column-gap:14px;}
  .full-title>*{flex:0 0 100%;}
  .full-title .cover{float:none;order:1;flex-basis:calc(50% - 7px);width:auto;margin:0;}
  .full-title .cover img,.full-title .cover .no-cover{aspect-ratio:2/3;height:auto;}
  .full-title:has(.ft-meta.no-photo) .cover{flex-basis:100%;}
  .full-title .byline{order:3;margin-top:14px;}
  .full-title h2{order:4;}
  .full-title .subtitle{order:5;}
  .full-title .ft-meta{display:contents;}
  .full-title .ft-photo{order:2;flex-basis:calc(50% - 7px);width:auto;height:auto;}
  .full-title .ft-photo img,.full-title .ft-photo .no-cover{aspect-ratio:2/3;height:auto;}
  .full-title .info-table{order:6;width:auto;margin-top:16px;}
  .full-title .desc{order:7;}
  .full-title .about-label{order:8;}
  .full-title .bio{order:9;}

  /* A thin scrubber down the right edge, echoing the iOS Photos-style
     date scrubber: a track spanning the viewport with a dot that tracks
     scroll position and a plain-text date label next to it, showing
     roughly "when" the content currently on screen was published. Drag
     the dot to jump straight to that point in the catalog instead of
     thumb-scrolling past 100+ titles. */
  .date-scrubber{display:block;position:fixed;top:calc(var(--toolbar-h, 74px) + var(--nav-h, 56px) + 20px);bottom:28px;right:18px;width:1px;z-index:90;}
  .ds-track{position:absolute;top:0;bottom:0;left:0;width:2px;border-radius:1px;background:var(--ink-3);opacity:.4;}
  .ds-thumb{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;transform:translate(-100%,-50%);touch-action:none;padding:10px 4px;}
  .ds-dot{width:13px;height:13px;border-radius:50%;background:var(--yellow);border:1.5px solid var(--ink);flex-shrink:0;}
  .ds-label{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;background:rgba(250,250,248,.9);padding:2px 6px;border-radius:4px;}
  .ds-label:empty{display:none;}
}

</style>

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatDate(iso) {
  if (!iso) return 'TBD';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function formatDateShort(iso) {
  if (!iso) return 'TBD';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
const FORM_LABELS = { BB: 'Hardcover', BC: 'Paperback', AJ: 'Audiobook', EB: 'eBook' };
const LYX = 'LYX', STORIES = '831 Stories';

// Maps each LYX title's ISBN to its lyxbooks.com product-page slug, so
// carousel cards can link straight out to the book's page on the imprint's
// own site. Confirmed by hand against lyxbooks.com/books (2026-09) — that
// site has no ISBN or catalog-id field of its own to join on, and a few
// announced titles (e.g. Scorpio Rising, High Hopes, This Spark) don't have
// a live page yet, so this is a manually-curated map rather than a formula,
// and a title with no entry here just renders without a link.

  '9798893310696': 'lessonsinfaking',
  '9798893311631': 'lessonsinfalling',
  '9798893311150': 'lessonsinforgiving',
  '9798893311679': 'levelsoflove',

  '9798893312300': 'sworntosecrecy',

function lyxUrlFor(t) {
  const s = LYX_BOOK_SLUGS[t.isbn13];
  return s ? `https://lyxbooks.com/books/p/${s}` : null;
}

// Series-level blurb + rights, keyed by the exact `series` string in the
// feed data. ONIX has no series-level description field at all (its

// catalog.js feed proxy) and the per-book "rights" ONIX supplies isn't
// necessarily the series' territory, so both are hand-entered here rather
// than read off a title record. Hopefully a future feed delivery carries
// this natively and this map goes away; a series with no entry here just
// renders without a description, and falls back to its first book's own
// ONIX rights.
const SERIES_INFO = {

// ── Seasons ─────────────────────────────────────────────────────────
// Three trade seasons/year: Spring (Jan-Apr), Summer (May-Aug), Fall
// (Sep-Dec). `key` is a monotonic integer (year*3 + seasonIndex) so seasons
// sort and step (+1 = "next season") without re-parsing labels.
const SEASON_NAMES = ['Spring', 'Summer', 'Fall'];
function seasonOf(pubDate) {
  if (!pubDate) return null;
  const d = new Date(pubDate + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const idx = d.getMonth() <= 3 ? 0 : d.getMonth() <= 7 ? 1 : 2;
  const y = d.getFullYear();
  return { key: y * 3 + idx, label: SEASON_NAMES[idx] + ' ' + y };
}
function seasonFromKey(key) {
  const idx = ((key % 3) + 3) % 3;
  const y = (key - idx) / 3;
  return { key, label: SEASON_NAMES[idx] + ' ' + y };
}

// ── BISAC -> catalog theme, matching the category set actually used in the
// original Canva backlist pages (Fiction / Self-Help & Inspiration / Memoir /
// Business & Tech / Politics, Current Events & History / Health, Wellness &
// Family), plus two the original also carved out: Personal Finance & Wealth
// (its own section there, not lumped into Business) and Games & Puzzles (the
// original's parallel "New York Times Games" section). True crime (e.g.
// Captain's Dinner) sits under Politics/History in the original, not its own
// bucket — confirmed against authorsequity.com/catalog, not a guess.
const THEME_MAP = {
  FIC: 'Fiction',
  BIO: 'Memoir', POE: 'Memoir',
  SEL: 'Self-Help & Inspiration', PSY: 'Self-Help & Inspiration',
  REL: 'Self-Help & Inspiration', SCI: 'Self-Help & Inspiration', PHI: 'Self-Help & Inspiration',
  EDU: 'Self-Help & Inspiration', LCO: 'Self-Help & Inspiration',
  BUS: 'Business & Tech', COM: 'Business & Tech', TEC: 'Business & Tech',
  POL: 'Politics, Current Events & History', TRU: 'Politics, Current Events & History',
  LAW: 'Politics, Current Events & History', HIS: 'Politics, Current Events & History',
  SOC: 'Politics, Current Events & History',
  HEA: 'Health, Wellness & Family', FAM: 'Health, Wellness & Family', MED: 'Health, Wellness & Family',
  GAM: 'Games & Puzzles', OCC: 'Games & Puzzles',
  ART: 'Self-Help & Inspiration', HUM: 'Self-Help & Inspiration', SPO: 'Health, Wellness & Family',
  CKB: 'Health, Wellness & Family',
};
// BISAC's personal-finance/investing sub-ranges under the BUS prefix — the
// original catalog gives these their own "Personal Finance & Wealth" section
// rather than folding them into general Business & Tech (e.g. The Simple
// Path to Wealth, Stay Calm, The Ladders of Wealth all land here).
const FINANCE_BUS_PREFIXES = ['BUS050', 'BUS059', 'BUS060', 'BUS069'];

function themeOf(t, titlesById) {
  // Seth Godin's card decks (The Mentor Deck, and any future ones) get
  // BISAC codes reflecting their subject matter (mentorship/business), which
  // scatters them away from the other deck/puzzle products — group by
  // product type instead for these.
  if (/deck/i.test(t.title || '') && /godin/i.test(t.author || '')) return 'Games & Puzzles';

  let codes = Array.isArray(t.bisacCodes) ? t.bisacCodes : [];
  // A format variant (e.g. "Fade In PB") is sometimes its own title record
  // with no ONIX marketing metadata of its own — borrow the base edition's
  // BISAC codes for classification rather than dumping it in a catch-all.
  if (!codes.length && titlesById) {
    const base = titlesById[t.id.replace(/-(pb|paperback|signed-edition)$/, '')];
    if (base && base.id !== t.id) codes = base.bisacCodes || [];
  }
  const first = codes[0] || '';
  if (FINANCE_BUS_PREFIXES.some(p => first.toUpperCase().startsWith(p))) return 'Personal Finance & Wealth';
  return THEME_MAP[first.slice(0, 3).toUpperCase()] || 'Business & Tech';
}

function editionsFor(t) {
  const eds = Array.isArray(t.editions) && t.editions.length ? t.editions : (t.isbn13 ? [{ form: '', isbn13: t.isbn13 }] : []);
  const seen = new Set();
  return eds.filter(e => e.isbn13 && !seen.has(e.isbn13) && seen.add(e.isbn13))
    .map(e => ({ label: FORM_LABELS[e.form] || e.form || 'Edition', isbn13: e.isbn13 }));
}
function byPubDate(a, b) {
  if (!a.pubDate) return 1; if (!b.pubDate) return -1;
  return new Date(a.pubDate) - new Date(b.pubDate);
}
function groupBy(list, fn) {
  const map = new Map();
  list.forEach(t => { const k = fn(t) || '(none)'; if (!map.has(k)) map.set(k, []); map.get(k).push(t); });
  return map;
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

// A missing cover must still reserve its normal box (same aspect ratio,
// same class hooks) — otherwise the item collapses to bare text and looks
// broken next to its neighbors, especially inside a carousel row.
function coverHtml(t) {
  return t.coverUrl ? `<img src="${esc(t.coverUrl)}" alt="">` : `<div class="no-cover">${esc(t.title)}</div>`;
}

// Reference layout (authorsequity.com/catalog) only has room for one photo
// slot next to the info table — a co-authored book just shows the first
// author with a photo on file, same as the byline still lists everyone.
function authorPhotoHtml(t) {
  const photo = (Array.isArray(t.authorPhotos) ? t.authorPhotos : []).find(p => p && p.url);
  return photo ? `<img src="${esc(photo.url)}" alt="${esc(photo.name || '')}">` : `<div class="no-cover">${esc((t.author || '').split(',')[0] || '')}</div>`;
}

function infoTableHtml(t, opts) {
  const eds = editionsFor(t);
  const price = [t.priceUS ? 'US ' + t.priceUS : '', t.priceCAN ? 'CAN ' + t.priceCAN : ''].filter(Boolean).join(' &middot; ');

  const infoRows = [
    // A LYX series box represents several books with different on-sale
    // dates, so showing just the first book's date read as the whole
    // series' date — the caller opts out of this row for that case.
    (opts && opts.hideOnSale) ? '' : `<div class="it-row"><span class="it-label">On Sale</span><span class="it-value">${formatDate(t.pubDate)}</span></div>`,
    price ? `<div class="it-row"><span class="it-label">Price</span><span class="it-value">${price}</span></div>` : '',
    ...eds.map(e => `<div class="it-row"><span class="it-label">${esc(e.label)}</span><span class="it-value">ISBN ${esc(e.isbn13)}</span></div>`),
    t.dimensions ? `<div class="it-row"><span class="it-label">Size</span><span class="it-value">${esc(t.dimensions)}</span></div>` : '',
    t.pageCount ? `<div class="it-row"><span class="it-label">Pages</span><span class="it-value">${esc(t.pageCount)}</span></div>` : '',
    t.rights ? `<div class="it-row"><span class="it-label">Rights</span><span class="it-value">${esc(t.rights)}</span></div>` : '',
  ].filter(Boolean).join('');

  return `<div class="info-table">${infoRows}</div>`;
}

function fullTitleHtml(t) {
  const hasPhoto = (Array.isArray(t.authorPhotos) ? t.authorPhotos : []).some(p => p && p.url);

  return `
    <div class="full-title" data-pubdate="${esc(t.pubDate || '')}">
      <div class="cover">${coverHtml(t)}</div>
      ${t.author ? `<div class="byline">${esc(t.author)}</div>` : ''}
      <h2>${esc(t.title)}</h2>
      ${t.subtitle ? `<div class="subtitle">${esc(t.subtitle)}</div>` : ''}
      <div class="ft-meta${hasPhoto ? '' : ' no-photo'}">
        ${hasPhoto ? `<div class="ft-photo">${authorPhotoHtml(t)}</div>` : ''}
        ${infoTableHtml(t)}
      </div>
      ${t.description ? `<div class="desc">${t.description}</div>` : ''}
      ${t.authorBio ? `<div class="about-label">About the Author</div><div class="bio">${t.authorBio}</div>` : ''}
    </div>
  `;
}

function editionLinesHtml(t) {
  const eds = editionsFor(t);
  return `<div>${formatDateShort(t.pubDate)}</div>` + eds.map(e => `<div>${esc(e.label)} ${esc(e.isbn13)}</div>`).join('');
}

function gridItemHtml(t, opts) {
  opts = opts || {};
  return `
    <div class="grid-item" data-pubdate="${esc(t.pubDate || '')}">
      ${coverHtml(t)}
      <div class="gi-title">${esc(t.title)}</div>
      ${t.author ? `<div class="gi-author">${esc(t.author)}</div>` : ''}
      <div class="gi-meta">${editionLinesHtml(t)}</div>
      ${opts.badge ? `<div class="gi-badge">${esc(opts.badge)}</div>` : ''}
    </div>
  `;
}

function carouselItemHtml(t) {
  const url = t.imprint === LYX ? lyxUrlFor(t) : null;
  const tag = url ? 'a' : 'div';
  const linkAttrs = url ? ` href="${esc(url)}" target="_blank" rel="noopener"` : '';
  return `
    <${tag} class="carousel-item" data-pubdate="${esc(t.pubDate || '')}"${linkAttrs}>
      ${coverHtml(t)}
      <div class="ci-title">${esc(t.title)}</div>
      <div class="ci-meta">${editionLinesHtml(t)}</div>
    </${tag}>
  `;
}

function carouselHtml(id, items, opts) {
  const narrow = opts && opts.narrow ? ' narrow' : '';
  return `
    <div class="carousel-wrap${narrow}">
      <button type="button" class="carousel-btn prev" data-target="${id}" aria-label="Scroll left">&#8249;</button>
      <div class="carousel-track" id="${id}">${items.map(carouselItemHtml).join('')}</div>
      <button type="button" class="carousel-btn next" data-target="${id}" aria-label="Scroll right">&#8250;</button>
    </div>
  `;
}

// ── Section builders ────────────────────────────────────────────────
function seasonSectionHtml(sectionId, heading, sub, titles) {
  if (!titles.length) return '';
  return `<div id="${sectionId}" class="section-title">${esc(heading)}</div>` +
    (sub ? `<div class="section-sub">${esc(sub)}</div>` : '') +
    titles.slice().sort(byPubDate).map(fullTitleHtml).join('');
}

function storiesSectionHtml(titles) {
  if (!titles.length) return '';
  const now = new Date();
  const future = titles.filter(t => t.pubDate && new Date(t.pubDate + 'T00:00:00') >= now);
  const pool = future.length ? future : titles;
  const soonestKey = Math.min(...pool.map(t => (seasonOf(t.pubDate) || { key: Infinity }).key));
  const featured = titles.filter(t => (seasonOf(t.pubDate) || {}).key === soonestKey);
  const seasonLabel = seasonFromKey(soonestKey).label;

  // The season right after the featured one gets its own "Coming Soon"
  // sub-heading inside the compact grid, rather than blending anonymously
  // into the rest of the backlist/future titles below it.
  const comingSoonKey = soonestKey + 1;
  const comingSoon = titles.filter(t => (seasonOf(t.pubDate) || {}).key === comingSoonKey);
  const comingSoonLabel = seasonFromKey(comingSoonKey).label;

  const handledIds = new Set([...featured, ...comingSoon].map(t => t.id));
  const rest = titles.filter(t => !handledIds.has(t.id)).sort(byPubDate);

  // Every 831 Stories title ships to the same spec (trim size, price,
  // paperback-only format), so rather than pick one of several current-
  // season books to represent the whole imprint, we anchor on Big Fan (the
  // imprint's first release) — falling back to the most recent title if
  // it's ever missing from the feed.
  const sortedByDate = titles.slice().sort(byPubDate);
  const specBook = titles.find(t => t.title === 'Big Fan') || sortedByDate[sortedByDate.length - 1];

  let html = `<div id="sec-831" class="section-title imprint-title"><a class="imprint-logo-link i831" href="https://831stories.com" target="_blank" rel="noopener" aria-label="831 Stories — visit 831stories.com"><img src="/assets/images/imprints/831-logo.png" alt="831 Stories"></a></div>
    <div class="section-sub">${featured.length} new for ${esc(seasonLabel)} &middot; ${titles.length} titles total</div>
    <div class="info-row">${infoTableHtml(specBook, { hideOnSale: true })}<div class="grid grid-featured">${featured.slice().sort(byPubDate).map(t => gridItemHtml(t, { badge: seasonLabel })).join('')}</div></div>`;
  if (comingSoon.length) {
    html += `<div class="subgroup-title">Coming Soon<span class="sg-note">${esc(comingSoonLabel)}</span></div>`;
    html += `<div class="grid grid-compact">${comingSoon.slice().sort(byPubDate).map(t => gridItemHtml(t)).join('')}</div>`;
  }
  if (rest.length) html += `<div class="grid grid-compact">${rest.map(t => gridItemHtml(t)).join('')}</div>`;
  return html;
}

function lyxSectionHtml(titles) {
  if (!titles.length) return '';
  const bySeries = groupBy(titles, t => t.series || t.author || 'Standalone');
  const order = [...bySeries.keys()].sort((a, b) => a.localeCompare(b));
  let html = `<div id="sec-lyx" class="section-title imprint-title"><a class="imprint-logo-link ilyx" href="https://lyxbooks.com" target="_blank" rel="noopener" aria-label="LYX — visit lyxbooks.com"><img src="/assets/images/imprints/lyx-logo.png" alt="LYX"></a></div><div class="section-sub">The New Standard in New Adult Romance &mdash; browse by series</div>`;
  order.forEach(series => {
    const items = bySeries.get(series).slice().sort((a, b) => {
      if (a.seriesPos && b.seriesPos) return (+a.seriesPos) - (+b.seriesPos);
      return byPubDate(a, b);
    });
    const author = items[0]?.author || '';
    const info = SERIES_INFO[series];
    // The series' own rights (when we have one on file) supersede whatever
    // ONIX has on the first book, which reflects that book's own rights deal
    // and isn't reliably the same as the series' — see SERIES_INFO above.
    const infoBook = info?.rights ? { ...items[0], rights: info.rights } : items[0];
    html += `<div class="subgroup-title">${esc(series)}${author ? `<span class="sg-note">by ${esc(author)}</span>` : ''}</div>`;
    if (info?.description) html += `<div class="series-desc">${esc(info.description)}</div>`;
    html += `<div class="info-row">${infoTableHtml(infoBook, { hideOnSale: true })}${carouselHtml('lyx-' + slug(series), items, { narrow: true })}</div>`;
  });
  return html;
}

// Shared by Backlist (strictly already-published) and Looking Ahead
// (announced for a season beyond the current+next window) — same
// browse-by-theme carousel treatment, different heading and id prefix so
// each title only ever needs true-or-false pub-date logic once, in render().
function themeCarouselSectionHtml(sectionId, idPrefix, heading, sub, titles, titlesById) {
  if (!titles.length) return '';
  const byTheme = groupBy(titles, t => themeOf(t, titlesById));
  const order = [...byTheme.keys()].sort((a, b) => a.localeCompare(b));
  let html = `<div id="${sectionId}" class="section-title">${esc(heading)}</div><div class="section-sub">${sub}</div>`;
  order.forEach(theme => {
    const items = byTheme.get(theme).slice().sort(byPubDate);
    html += `<div class="subgroup-title">${esc(theme)}<span class="sg-note">${items.length} title${items.length === 1 ? '' : 's'}</span></div>`;
    html += carouselHtml(idPrefix + '-' + slug(theme), items);
  });
  return html;
}

// A format variant published as its own title record (e.g. "Fade In PB",
// "Captain's Dinner PB") shouldn't also show up as its own separate card —
// fold its ISBN into the base edition's list instead. A signed edition
// (e.g. "Future Relic Signed Edition") isn't a separate catalog entry at
// all — drop it. Applied once, up front, before any section bucketing.
function mergeSiblingRecords(titles) {
  const byId = {};
  titles.forEach(t => { byId[t.id] = t; });
  const drop = new Set();
  const merged = titles.map(t => ({ ...t }));
  const mergedById = {};
  merged.forEach(t => { mergedById[t.id] = t; });

  titles.forEach(t => {
    const m = t.id.match(/^(.+)-(pb|paperback|signed-edition)$/);
    if (!m) return;
    const base = mergedById[m[1]];
    if (!base) return; // no sibling on file — leave it as its own card
    if (m[2] === 'signed-edition') { drop.add(t.id); return; }
    const baseRaw = Array.isArray(base.editions) && base.editions.length ? base.editions.slice() : (base.isbn13 ? [{ form: '', isbn13: base.isbn13 }] : []);
    const pbRaw = Array.isArray(t.editions) && t.editions.length ? t.editions : (t.isbn13 ? [{ form: 'BC', isbn13: t.isbn13 }] : []);
    pbRaw.forEach(e => { if (e.isbn13 && !baseRaw.some(be => be.isbn13 === e.isbn13)) baseRaw.push(e); });
    base.editions = baseRaw;
    drop.add(t.id);
  });

  return merged.filter(t => !drop.has(t.id));
}

let allTitles = [];
let currentSeason, nextSeason;

function render(rawTitles) {
  const root = document.getElementById('root');
  const titles = mergeSiblingRecords(rawTitles);
  if (!titles.length) { root.innerHTML = '<div class="error">No titles match.</div>'; return; }

  // At least one 831 Stories title ("Vacation Self") is on file with imprint
  // wrongly set to "Authors Equity" — its subtitle ("An 831 Stories Romance")
  // still tags it correctly, so check that too rather than trust imprint
  // alone and let a mistagged record land in the wrong top-level section.
  const isStories = t => t.imprint === STORIES || /831 stories/i.test(t.subtitle || '');
  const lyxTitles = titles.filter(t => t.imprint === LYX);
  const storiesTitles = titles.filter(isStories);
  const mainTitles = titles.filter(t => t.imprint !== LYX && !isStories(t));

  const current = mainTitles.filter(t => (seasonOf(t.pubDate) || {}).key === currentSeason.key);
  const next = mainTitles.filter(t => (seasonOf(t.pubDate) || {}).key === nextSeason.key);
  const handled = new Set([...current, ...next].map(t => t.id));
  const leftover = mainTitles.filter(t => !handled.has(t.id));
  // "Backlist" means already published — a title whose date got pushed out
  // past the current+next window (e.g. re-scheduled after this catalog last
  // categorized it) is still upcoming, not backlist, even though it isn't
  // in the current+next spreads either. Give those their own section rather
  // than mislabel them "previously published."
  const today = new Date();
  const isFuture = t => t.pubDate && new Date(t.pubDate + 'T00:00:00') >= today;
  const backlist = leftover.filter(t => !isFuture(t));
  const future = leftover.filter(isFuture);

  document.getElementById('season-range').textContent = `${currentSeason.label} – ${nextSeason.label}`;

  let html = seasonSectionHtml('sec-current', currentSeason.label, 'New & current this season', current);
  html += seasonSectionHtml('sec-next', nextSeason.label, 'Coming next season', next);
  html += storiesSectionHtml(storiesTitles);
  html += lyxSectionHtml(lyxTitles);
  const titlesById = {};
  allTitles.forEach(t => { titlesById[t.id] = t; });
  html += themeCarouselSectionHtml('sec-backlist', 'bl', 'Backlist', 'Previously published &mdash; browse by category', backlist, titlesById);
  html += themeCarouselSectionHtml('sec-future', 'fu', 'Looking Ahead', 'Announced for later seasons &mdash; browse by category', future, titlesById);

  root.innerHTML = html;

  // Season-nav pills only ever need building once (on the unfiltered load),
  // but harmless to rebuild — cheap and keeps it in sync if data changes.
  const navPills = [];
  if (current.length) navPills.push({ id: 'sec-current', label: currentSeason.label });
  if (next.length) navPills.push({ id: 'sec-next', label: nextSeason.label });
  if (storiesTitles.length) navPills.push({ id: 'sec-831', label: '831 Stories' });
  if (lyxTitles.length) navPills.push({ id: 'sec-lyx', label: 'LYX' });
  if (backlist.length) navPills.push({ id: 'sec-backlist', label: 'Backlist' });
  if (future.length) navPills.push({ id: 'sec-future', label: 'Looking Ahead' });
  const nav = document.getElementById('season-nav');
  nav.innerHTML = '<span class="label">Browse</span>' + navPills.map(p => `<a href="#${p.id}">${esc(p.label)}</a>`).join('');

  updateCarouselArrows();
  alignAuthorPhotoHeights();
  alignCoverHeights();
  document.querySelectorAll('.full-title .cover img').forEach(img => {
    if (!img.complete) img.addEventListener('load', alignCoverHeights, { once: true });
  });
  setupScrollSpy();
  updateDateScrubber();
}

// Highlights the season-nav link for whichever section is currently at the
// top of the viewport, so the rail also works as a "where am I" indicator
// while scrolling — not just a set of jump links. Re-run every render()
// since search filtering replaces the section-title elements (and the nav
// pills) with new nodes the old observer isn't watching.
let scrollSpyObserver = null;
function setupScrollSpy() {
  if (scrollSpyObserver) scrollSpyObserver.disconnect();
  const sections = [...document.querySelectorAll('.section-title[id]')];
  if (!sections.length) return;
  scrollSpyObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      document.querySelectorAll('.season-nav a').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + entry.target.id);
      });
    });
  }, { rootMargin: '-15% 0px -75% 0px' });
  sections.forEach(s => scrollSpyObserver.observe(s));
}

// The right-edge date scrubber: a dot that tracks overall scroll position
// (0 at the top of the page, 1 at the bottom) plus a label showing the
// pubDate of whichever dated card is currently nearest the top of the
// viewport — and a drag handle on the dot to jump straight to a point in
// the catalog instead of thumb-scrolling past 100+ titles.
function formatMonthYear(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}
function updateDateScrubber() {
  const scrubber = document.getElementById('date-scrubber');
  const thumb = document.getElementById('ds-thumb');
  const label = document.getElementById('ds-label');
  if (!scrubber || !thumb || !label) return;

  const trackHeight = scrubber.getBoundingClientRect().height;
  const scrollable = document.documentElement.scrollHeight - window.innerHeight;
  const fraction = scrollable > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollable)) : 0;
  thumb.style.top = Math.round(fraction * trackHeight) + 'px';

  const refY = (document.querySelector('.toolbar')?.getBoundingClientRect().bottom || 0) + 40;
  const dated = [...document.querySelectorAll('[data-pubdate]')].filter(el => el.dataset.pubdate);
  let current = dated[0];
  for (const el of dated) {
    if (el.getBoundingClientRect().top > refY) break;
    current = el;
  }
  label.textContent = current ? formatMonthYear(current.dataset.pubdate) : '';
}

function setupDateScrubberDrag() {
  const scrubber = document.getElementById('date-scrubber');
  const thumb = document.getElementById('ds-thumb');
  if (!scrubber || !thumb) return;
  let dragging = false;
  const scrubTo = (clientY) => {
    const rect = scrubber.getBoundingClientRect();
    const fraction = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    window.scrollTo(0, fraction * scrollable);
    updateDateScrubber();
  };
  thumb.addEventListener('pointerdown', (e) => {
    dragging = true;
    thumb.setPointerCapture(e.pointerId);
    scrubTo(e.clientY);
  });
  thumb.addEventListener('pointermove', (e) => { if (dragging) scrubTo(e.clientY); });
  const stop = () => { dragging = false; };
  thumb.addEventListener('pointerup', stop);
  thumb.addEventListener('pointercancel', stop);
}
let scrubberTicking = false;
window.addEventListener('scroll', () => {
  if (scrubberTicking) return;
  scrubberTicking = true;
  requestAnimationFrame(() => { updateDateScrubber(); scrubberTicking = false; });
});

// The author photo and the info table sit side by side as a matched pair
// (like the two boxes in the reference layout) — match the photo's height
// to whatever the table actually rendered at, so their bottom edges align
// instead of the photo (fixed width, natural or arbitrary height) either
// falling short or overshooting a table whose row count varies by title
// (multi-edition books get an extra ISBN row, price is sometimes absent).
function alignAuthorPhotoHeights() {
  // Below 640px the photo sits next to the cover in its own 2-up row (see
  // the mobile media query) instead of being paired with the info table —
  // matching its height to the table there would stretch/shrink it to a box
  // in a completely different part of the layout, so leave it to the
  // aspect-ratio CSS instead.
  const mobile = window.innerWidth <= 640;
  document.querySelectorAll('.ft-meta:not(.no-photo)').forEach(row => {
    const photoBox = row.querySelector('.ft-photo');
    const table = row.querySelector('.info-table');
    if (!photoBox || !table) return;
    photoBox.style.height = mobile ? '' : Math.round(table.getBoundingClientRect().height) + 'px';
  });
}

// On desktop, size the floated cover so it spans exactly from the top of the
// byline (the author name — or the title itself, for the rare title with no
// byline) down to the bottom of the photo/info-table row below it — echoing
// a print layout's cover-anchored-to-its-copy-block look instead of an
// arbitrary float height. Width (not height) is what we adjust, scaled from
// the cover's own intrinsic aspect ratio, so it's never stretched or
// letterboxed. Mobile drops covers into their own 2-up row (see media
// query) where this pairing doesn't apply, so it's skipped there.
function alignCoverHeights() {
  const mobile = window.innerWidth <= 640;
  document.querySelectorAll('.full-title').forEach(block => {
    const cover = block.querySelector(':scope > .cover');
    const anchor = block.querySelector(':scope > .byline') || block.querySelector(':scope > h2');
    const ftMeta = block.querySelector(':scope > .ft-meta');
    if (!cover || !anchor || !ftMeta) return;
    if (mobile) { cover.style.width = ''; cover.style.marginTop = ''; return; }

    // Reset first so a width/margin set on a previous pass doesn't skew the
    // measurements we're about to take (it can shift how the subtitle wraps).
    cover.style.width = '';
    cover.style.marginTop = '';

    const img = cover.querySelector('img');
    const ratio = img && img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 2 / 3;

    // Measured off the cover's own (reset-to-zero) top rather than the
    // block's, so the block's padding/border isn't counted twice.
    const coverTop = cover.getBoundingClientRect().top;
    const anchorTop = anchor.getBoundingClientRect().top;
    const marginTop = Math.max(0, Math.round(anchorTop - coverTop));
    const targetHeight = Math.max(1, Math.round(ftMeta.getBoundingClientRect().bottom - anchorTop));

    cover.style.marginTop = marginTop + 'px';
    cover.style.width = Math.round(targetHeight * ratio) + 'px';
  });
}

// A carousel with nothing to scroll to (series/theme small enough to fit
// entirely) shouldn't show arrows that do nothing when clicked — that's
// what read as "not working." Hide both, then re-show/disable individually
// as the user scrolls.
function updateCarouselArrows() {
  document.querySelectorAll('.carousel-wrap').forEach(wrap => {
    const track = wrap.querySelector('.carousel-track');
    const [prev, next] = wrap.querySelectorAll('.carousel-btn');
    const overflowing = track.scrollWidth > track.clientWidth + 1;
    prev.style.display = overflowing ? '' : 'none';
    next.style.display = overflowing ? '' : 'none';
    if (!overflowing) return;
    const sync = () => {
      prev.disabled = track.scrollLeft <= 0;
      next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 1;
    };
    track.addEventListener('scroll', sync);
    sync();
  });
}
// The season-nav's sticky offset has to equal the toolbar's actual rendered
// height, which varies (the catalog-title wraps to two lines and the search
// box drops to its own row below ~640px) — a hardcoded px offset here was
// wrong on mobile and let the season-nav slide up under the toolbar.
function syncToolbarHeight() {
  const h = document.querySelector('.toolbar').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--toolbar-h', Math.round(h) + 'px');
  // The season-nav is sticky right below the toolbar and stays on screen for
  // the whole scroll, so the date scrubber (also fixed) needs to start below
  // it too, not just below the toolbar — otherwise its top portion, and the
  // dot whenever it's near position 0, renders underneath the nav pills.
  const navH = document.querySelector('.season-nav').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--nav-h', Math.round(navH) + 'px');
}
window.addEventListener('resize', () => { syncToolbarHeight(); updateDateScrubber(); if (allTitles.length) { updateCarouselArrows(); alignAuthorPhotoHeights(); alignCoverHeights(); } });

function applySearch() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (!q) { render(allTitles); return; }
  render(allTitles.filter(t => ((t.title||'')+' '+(t.author||'')).toLowerCase().includes(q)));
}

document.getElementById('search').addEventListener('input', applySearch);
document.getElementById('root').addEventListener('click', (e) => {
  const btn = e.target.closest('.carousel-btn');
  if (!btn) return;
  const track = document.getElementById(btn.dataset.target);
  if (!track) return;
  track.scrollBy({ left: btn.classList.contains('prev') ? -320 : 320, behavior: 'smooth' });
});

async function load() {
  try {
    // Root-relative (not "/api/catalog") so this keeps working when the page
    // is reverse-proxied at authorsequity.com/catalog/ instead of served at
    // this site's own root — the API call then resolves to
    // /catalog/api/catalog, matching wherever the page itself was loaded from.
    const base = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
    const res = await fetch(base + 'api/catalog');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load catalog');
    allTitles = data.titles || [];
    const today = seasonOf(new Date().toISOString().slice(0, 10));
    currentSeason = today;
    nextSeason = seasonFromKey(today.key + 1);
    document.getElementById('gen-note').textContent = data.generatedAt
      ? `${allTitles.length} titles · updated ${new Date(data.generatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`
      : `${allTitles.length} titles`;
    render(allTitles);
    syncToolbarHeight();
  } catch (err) {
    document.getElementById('root').innerHTML = `<div class="error">Couldn't load the catalog: ${esc(err.message || err)}</div>`;
    document.getElementById('gen-note').textContent = 'Error loading';
  }
}
syncToolbarHeight();
setupDateScrubberDrag();
load();
</script>
</body>
</html>
